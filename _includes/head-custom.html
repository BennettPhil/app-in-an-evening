<style>
  .code-block-wrapper {
    position: relative;
  }

  .copy-code-button {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    padding: 3px 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.4;
    color: #444;
    background-color: #fff;
    border: 1px solid #c6cbd1;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .copy-code-button:hover {
    opacity: 1;
    background-color: #f0f0f0;
  }

  .copy-code-button.copied {
    opacity: 1;
    color: #1a7f37;
    border-color: #1a7f37;
  }

  .copy-code-button.copy-failed {
    opacity: 1;
    color: #cb2431;
    border-color: #cb2431;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          resolve();
        } catch (err) {
          reject(err);
        } finally {
          document.body.removeChild(textarea);
        }
      });
    }

    document.querySelectorAll('pre').forEach(function (pre) {
      if (pre.closest('.code-block-wrapper')) return;

      var target = pre.closest('.highlighter-rouge') || pre;
      var wrapper = document.createElement('div');
      wrapper.className = 'code-block-wrapper';
      target.parentNode.insertBefore(wrapper, target);
      wrapper.appendChild(target);

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code-button';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', 'Copy code to clipboard');
      wrapper.appendChild(button);

      var resetTimer;
      button.addEventListener('click', function () {
        copyText(pre.textContent.replace(/\n$/, '')).then(function () {
          button.textContent = 'Copied!';
          button.classList.remove('copy-failed');
          button.classList.add('copied');
        }, function () {
          button.textContent = 'Copy failed';
          button.classList.remove('copied');
          button.classList.add('copy-failed');
        });

        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          button.textContent = 'Copy';
          button.classList.remove('copied', 'copy-failed');
        }, 2000);
      });
    });
  });
</script>
